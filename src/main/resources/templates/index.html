<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Smart Expense Tracker</h1>

        <div class="card">
            <h2>Add New Expense</h2>
            <form id="expenseForm">
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount:</label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label for="category">Category:</label>
                    <input type="text" id="category" name="category" required>
                </div>
                <div class="form-group">
                    <label for="date">Date:</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <button type="submit">Add Expense</button>
            </form>
            <div id="formMessage"></div>
        </div>

        <div class="card">
            <h2>Filter & Summary</h2>
            <div class="filter-section">
                <label for="filterCategory">Category Filter:</label>
                <input type="text" id="filterCategory" placeholder="e.g. Food">
                <button type="button" onclick="loadData()">Filter</button>
                <button type="button" onclick="document.getElementById('filterCategory').value=''; loadData()">Clear</button>
            </div>
            
            <div class="summary-section">
                <h3>Overall Total: $<span id="totalAmount">0.00</span></h3>
                
                <h3>Monthly Summary:</h3>
                <div id="monthlySummary"></div>
            </div>
        </div>

        <div class="card">
            <h2>All Expenses</h2>
            <table id="expensesTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Default date to today
            document.getElementById('date').valueAsDate = new Date();
            loadData();
        });

        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const expense = {
                title: document.getElementById('title').value,
                amount: parseFloat(document.getElementById('amount').value),
                category: document.getElementById('category').value,
                date: document.getElementById('date').value
            };

            try {
                const response = await fetch('/api/expenses', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(expense)
                });
                
                if (response.ok) {
                    document.getElementById('expenseForm').reset();
                    document.getElementById('date').valueAsDate = new Date();
                    document.getElementById('formMessage').textContent = 'Expense added successfully!';
                    document.getElementById('formMessage').style.color = 'green';
                    loadData();
                } else {
                    const error = await response.json();
                    document.getElementById('formMessage').textContent = 'Failed to add expense. Check inputs.';
                    document.getElementById('formMessage').style.color = 'red';
                }
            } catch (error) {
                console.error("Error adding expense:", error);
            }
        });

        async function loadData() {
            loadExpenses();
            loadTotal();
            loadMonthlySummary();
        }

        async function loadExpenses() {
            const category = document.getElementById('filterCategory').value;
            let url = '/api/expenses';
            if (category) {
                url += `?category=${encodeURIComponent(category)}`;
            }
            
            const response = await fetch(url);
            const expenses = await response.json();
            
            const tbody = document.querySelector('#expensesTable tbody');
            tbody.innerHTML = '';
            
            expenses.forEach(exp => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${exp.date}</td>
                    <td>${exp.title}</td>
                    <td>${exp.category}</td>
                    <td>$${exp.amount.toFixed(2)}</td>
                    <td><button class="btn-delete" onclick="deleteExpense(${exp.id})">Delete</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function loadTotal() {
            const category = document.getElementById('filterCategory').value;
            let url = '/api/expenses/total';
            if (category) {
                url += `?category=${encodeURIComponent(category)}`;
            }
            
            const response = await fetch(url);
            const total = await response.json();
            document.getElementById('totalAmount').textContent = total.toFixed(2);
        }

        async function loadMonthlySummary() {
            const response = await fetch('/api/expenses/summary/monthly');
            const summary = await response.json();
            
            const summaryDiv = document.getElementById('monthlySummary');
            summaryDiv.innerHTML = '';
            
            if (Object.keys(summary).length === 0) {
                summaryDiv.innerHTML = '<p>No data available.</p>';
                return;
            }
            
            for (const [month, data] of Object.entries(summary)) {
                const monthCard = document.createElement('div');
                monthCard.className = 'month-card';
                
                let categoriesHtml = '';
                for (const [cat, amt] of Object.entries(data.byCategory)) {
                    categoriesHtml += `<li>${cat}: $${amt.toFixed(2)}</li>`;
                }
                
                monthCard.innerHTML = `
                    <h4>${month} - Total: $${data.total.toFixed(2)}</h4>
                    <ul>${categoriesHtml}</ul>
                `;
                summaryDiv.appendChild(monthCard);
            }
        }

        async function deleteExpense(id) {
            if (!confirm('Are you sure you want to delete this expense?')) return;
            
            const response = await fetch(`/api/expenses/${id}`, { method: 'DELETE' });
            if (response.ok) {
                loadData();
            } else {
                alert('Failed to delete expense.');
            }
        }
    </script>
</body>
</html>
